{{ define "main" }}
  {{ partial "page-header" . }}
  {{ $currentMembers := where .RegularPages "Params.former" "ne" true }}

  <section class="section">
    <div class="container">
      <div class="row">
        {{ range $currentMembers }}
          <div class="md:col-6 lg:col-4 mb-14">
            {{ partial "components/author-card" . }}
          </div>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
